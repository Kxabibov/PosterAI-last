<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nidu AI — Generate stunning AI-powered product posters in seconds. Upload your image, choose a style, and let AI do the rest." />
    <link rel="icon" href="/logo.png" type="image/png" />
    <title>Nidu AI — AI-Powered Product Poster Generator</title>
  </head>
  <body>
    <div id="error-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); color:#ff5555; padding:20px; font-family:monospace; z-index:99999; overflow:auto; white-space:pre-wrap;"></div>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        const overlay = document.getElementById('error-overlay');
        if (overlay) {
          overlay.style.display = 'block';
          overlay.innerHTML = '<h1>Runtime Error</h1>' +
            '<p><b>Message:</b> ' + message + '</p>' +
            '<p><b>Source:</b> ' + source + ':' + lineno + ':' + colno + '</p>' +
            '<p><b>Stack:</b> ' + (error && error.stack ? error.stack : 'No stack trace available') + '</p>';
        }
      };
      window.addEventListener('unhandledrejection', function(event) {
        const overlay = document.getElementById('error-overlay');
        if (overlay) {
          overlay.style.display = 'block';
          overlay.innerHTML = '<h1>Unhandled Promise Rejection</h1>' +
            '<p><b>Reason:</b> ' + event.reason + '</p>';
        }
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
